name: Build GFS-Wave Frames

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test builds 3 frames; full builds every 3 hours through +240h"
        required: true
        default: test
        type: choice
        options:
          - test
          - full

  schedule:
    - cron: "30 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: gfs-wave-frame-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/gfs-wave/requirements.txt

      - name: Verify ecCodes
        run: python -m eccodes selfcheck

      - name: Build and upload wave frames
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: stormwatch-gfs-wave
        run: |
          python scripts/gfs-wave/build_frames.py --mode "${{ inputs.mode || 'full' }}"
