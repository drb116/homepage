<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Private family dashboard for meals, schedules, weather, and home information.">
  <title>Family Home | DavidB.xyz</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <div class="page-shell dashboard-shell">
    <header class="topbar dashboard-topbar">
      <a class="brand" href="/" aria-label="Family Home">
        <span class="brand-mark">DB</span>
        <span>Family Home</span>
      </a>

      <div class="dashboard-clock" aria-label="Current date and time">
        <span class="header-date" id="header-date">Today</span>
        <span class="clock-separator" aria-hidden="true">•</span>
        <span id="header-time"></span>
      </div>
    </header>

    <main>
      <!-- Calendar layout intentionally left unchanged. -->
      <section class="dashboard-section calendar-section" aria-labelledby="calendar-heading">
        <div class="section-bar calendar-section-bar">
          <div>
            <p class="panel-kicker calendar-kicker">Google Family calendar</p>
            <h2 id="calendar-heading">Coming up</h2>
          </div>

          <div class="section-actions">
            <span class="sync-status" id="calendar-sync-status" aria-live="polite">
              <span class="sync-dot"></span>
              Loading…
            </span>
            <button class="refresh-button calendar-refresh" id="btn-refresh-calendar" type="button" aria-label="Refresh family calendar" title="Refresh family calendar">↻</button>
            <a class="manage-link calendar-manage-link" href="https://calendar.google.com/calendar/u/0/r" target="_blank" rel="noopener">Google Calendar <span aria-hidden="true">↗</span></a>
          </div>
        </div>

        <article class="calendar-card">
          <div class="calendar-days" id="calendar-days">
            <div class="calendar-loading">Loading family calendar…</div>
          </div>
        </article>
      </section>

      <section class="dashboard-section glance-section" aria-label="Weather and dinner plans">
        <div class="glance-grid">
          <article class="weather-card">
            <div class="compact-card-heading">
              <div>
                <p class="panel-kicker weather-kicker">Weather</p>
                <h2>At home</h2>
              </div>
              <button class="refresh-button weather-refresh" id="btn-refresh-weather" type="button" aria-label="Refresh weather" title="Refresh weather">↻</button>
            </div>

            <div class="weather-current">
              <div class="weather-icon" id="weather-icon" aria-hidden="true">–</div>
              <div class="weather-current-reading">
                <span class="weather-current-temp" id="weather-current-temp">--°</span>
                <span class="weather-current-label">Outside</span>
              </div>
            </div>

            <div class="forecast-rows">
              <div class="forecast-row">
                <span>Today</span>
                <strong id="weather-today">--° / --°</strong>
              </div>
              <div class="forecast-row">
                <span>Tomorrow</span>
                <strong id="weather-tomorrow">--° / --°</strong>
              </div>
            </div>

            <div class="weather-status" id="weather-status" aria-live="polite">Loading weather…</div>
          </article>

          <article class="dinner-card">
            <div class="compact-card-heading">
              <div>
                <p class="panel-kicker dinner-kicker">Meals & recipes</p>
                <h2>Dinner plans</h2>
              </div>

              <div class="compact-actions">
                <span class="sync-status compact-sync-status" id="meal-sync-status" aria-live="polite">
                  <span class="sync-dot"></span>
                  Loading…
                </span>
                <button class="refresh-button" id="btn-refresh-meals" type="button" aria-label="Refresh dinner plans" title="Refresh dinner plans">↻</button>
                <a class="compact-manage-link" href="/meals/" aria-label="Open meals and recipes">↗</a>
              </div>
            </div>

            <div class="dinner-list" id="dinner-list">
              <div class="dinner-placeholder">Loading dinner plans…</div>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
